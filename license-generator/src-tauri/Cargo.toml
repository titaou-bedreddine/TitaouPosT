[package]
name = "titaou-license-generator"
version = "0.6.0"
description = "TitaouPOS standalone license generator (developer tool)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
minisign = "0.7"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

[profile.release]
lto = true
strip = true
